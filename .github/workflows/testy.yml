name: Testy

on:
  pull_request:
  push:
    branches: [main]

jobs:
  selftest:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -c "import tkinter"
      - run: python podglad_ksef.py --selftest
